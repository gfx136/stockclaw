name: Build unsigned iOS IPA

# 手动触发：GitHub 网页 Actions 标签页 → 选本工作流 → Run workflow
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    # ⚠️ runner + Xcode 选择结论（2026-10-21 用日志实证，别再走弯路）：
    #   · 最后一次成功构建 run 39418817313（2026-10-20 11:58Z，产出 v8）
    #     跑在 macos-latest 上，实际使用的是 **Xcode 26.6**。
    #   · macos-14 上 Xcode 16.2 的失败原因不是"版本太旧"这么笼统，
    #     而是 pod 里的 SwiftPM 包要求 swift-tools-version 6.2.0：
    #       xcodebuild: error: Could not resolve package dependencies:
    #         package 'apple' is using Swift tools version 6.2.0
    #         but the installed version is 6.0.0
    #     Swift 6.2 只在 Xcode 26+ 提供 → Xcode 16.2(6.0) / 16.4(6.1) 都不够。
    #   ⇒ 必须选 Xcode 26.x，所以锁 16.4 是错的，改为"取最新的 Xcode 26"。
    #   · 容量：macos-15/latest 共享池拥挤，排队满 15 分钟会被系统取消（runner 为空、
    #     步骤数 0）。这不是编译错误，配合 scripts/retry-ipa.sh 反复撞窗口即可。
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode
        run: |
          # 必须 Xcode 26+（Swift 6.2）。取已装的最高 26.x，没有再退回最高版本。
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            XC=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XC" ]; then
            echo "::error::镜像里找不到 Xcode 26+，Swift 6.2 无法满足，构建必失败"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XC"
          echo "Selected: $XC"
          xcodebuild -version
          swift --version

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild native iOS project
        run: CI=1 npx expo prebuild --platform ios

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Find workspace and scheme
        id: target_scheme
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          PROJECT=$(ls -d ios/*.xcodeproj | head -n1)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -workspace "${{ steps.target_scheme.outputs.workspace }}" \
            -scheme "${{ steps.target_scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -maxdepth 2 -name "*.app" -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found"
            exit 1
          fi
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r stockclaw.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockclaw-ipa
          path: build/stockclaw.ipa
          retention-days: 14
